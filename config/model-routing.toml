# Mission Control - which TIER each LLM call starts at.
#
# The models themselves are defined per tier in .env, beside the API keys that
# pay for them:
#     MC_TIER_ORDER=T1,T2,T3,T4
#     MC_MODEL_T1=openrouter/qwen/qwen3-30b-a3b-instruct-2507
#     MC_MODEL_T4=claude-opus-5
#
# This file only says which tier a call begins at. A call that fails JSON
# validation escalates to the next tier, so the last tier is the safety net.
#
# A tag that is not listed here is not routed: it goes to the default Claude
# model. Set enabled = false to send every call there.

enabled = true

[tags]
# Prefix match; the longest matching prefix wins.

# role-cat: advisory archetype suggestion for uncategorised roles.
#   Eval 2026-09-12 (8 roles, truth = claude): qwen3-30b agreed 6/8, $0.0001, 3.5s.
#   Larger models agreed LESS (gpt-oss-20b 3/8, gpt-oss-120b 2/8).
"role-cat" = "T1"

# org-sectors: a two-word sector label for the tracker UI.
#   Eval 2026-09-12 (20 orgs): qwen3-30b matched claude's industry on 16/20,
#   $0.0002, 2.8s. Disagreements are wording, not meaning.
"org-sectors" = "T1"

# content-radar: summarise articles and repos. Weekly, tolerant of paraphrase.
"content-radar" = "T2"

# job-fit: the judgement you actually read and act on, so it starts at the
# frontier tier rather than being routed down. It is named here like every
# other call - an unrouted tag has no model name, which the Anthropic API
# cannot accept.
"job-fit" = "T3"

# USD per million tokens, used to cost calls made through the Anthropic API
# (LLM_BACKEND=api). The API returns token counts but no price, so without this
# a run reports $0.000 however much it spent. The claude CLI and OpenRouter both
# report their own real cost and ignore this table.
#
# cache_write is the premium for storing a cached prefix, cache_read the
# discount for reusing it - that discount is what makes small batches cheap.
# List prices as of this commit; edit when the rate card changes.
[prices]
"claude-sonnet-5"  = { input = 3.0,  output = 15.0, cache_write = 3.75,  cache_read = 0.30 }
"claude-sonnet-4-6" = { input = 3.0, output = 15.0, cache_write = 3.75,  cache_read = 0.30 }
"claude-opus-5"    = { input = 15.0, output = 75.0, cache_write = 18.75, cache_read = 1.50 }
"claude-haiku-4-5-20251001" = { input = 1.0, output = 5.0, cache_write = 1.25, cache_read = 0.10 }
