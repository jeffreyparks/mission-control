# Content Sources for Mission Control
# RSS feeds to scan for trending topics aligned with career goals
#
# Format:
#   - name: Display name
#     url: RSS feed URL
#     category: Category for grouping (AI/ML, Measurement, Data Science, Tech)
#
# To add a source:
#   1. Find the RSS feed URL (usually /feed, /rss, or /rss.xml)
#   2. Add it below with a descriptive name and category
#   3. Run: uv run run_daily.py
#
# To remove a source:
#   1. Delete or comment out the entry
#   2. Run again

sources:
  # AI & Machine Learning
  - name: OpenAI Blog
    url: https://openai.com/blog/rss.xml
    category: AI/ML
    
  - name: Anthropic News
    url: https://www.anthropic.com/news/rss.xml
    category: AI/ML
    
  # Tech Engineering Blogs (Measurement & Experimentation)
  - name: Netflix Tech Blog
    url: https://netflixtechblog.com/feed
    category: Measurement
    
  - name: Meta Engineering
    url: https://engineering.fb.com/feed/
    category: Measurement
    
  - name: Uber Engineering
    url: https://eng.uber.com/feed/
    category: Data Science
    
  - name: Spotify Engineering
    url: https://engineering.atspotify.com/feed/
    category: Measurement
    
  # Data Science & Analytics
  - name: Towards Data Science
    url: https://towardsdatascience.com/feed
    category: Data Science
    
  # General Tech News
  - name: Hacker News Best
    url: https://hnrss.org/best
    category: Tech

