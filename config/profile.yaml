# Mission Control - the Profile tab.
#
# This is the tracked default. To set your own, copy it to
# workspace/<name>/config/profile.yaml and edit that copy; the workspace copy
# wins, and stays out of git with the rest of your data.

# Personal or portfolio sites to read, alongside LinkedIn, GitHub and BlueSky.
# max_pages: 0 reads the page at `url` only; N also reads up to N more pages
# listed in the site's sitemap.xml.
sites: []
#  - url: https://you.github.io/
#    max_pages: 0

# A LinkedIn export older than this many days is flagged as stale.
linkedin_stale_days: 30

# Used by the evaluation (a later step of the Profile tab):
reevaluate_days: 7          # re-judge at least this often, even with nothing changed
pursued_min_fit: 8          # a role scoring this or higher counts as pursued, applied or not
pursued_window_days: 60     # how far back pursued roles are read
