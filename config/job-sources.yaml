# ============================================================
# SCANNING RULES
# ============================================================
rules:
  # Minimum keyword match score (0-100) to save role
  min_match_score: 50
  
  # Keywords that boost relevance
  must_have_keywords:
    - measurement
    - attribution
    - experimentation
    - incrementality
    - marketing science
    
  # Skip roles containing these terms
  exclude_keywords:
    - junior
    - intern
    - entry level
    
  # Maximum age of posting to consider (days)
  max_age_days: 30

  # Title heuristics for the LIVE SCAN only (agents/job_intel.py): a brand-new
  # live find whose title matches one of these (case-insensitive, whole-phrase)
  # is closed immediately - Status "04 Closed", recommendation "skip" - with NO
  # LLM fit call spent on it. Existing tracker rows are never touched by this,
  # regardless of title, so a role you added or edited yourself is safe.
  # Add or remove phrases freely; each is a substring match with word
  # boundaries, so "Machine Learning Engineer" also matches "Senior Machine
  # Learning Engineer" but not "Machine Learning Engineering Manager"'s
  # "Engineering".
  auto_close_titles:
    - "engineer"
    - "research scientist"
    - "account executive"
    - "strategist"
    - "manager"
