# ============================================================
# SCANNING RULES
# ============================================================
rules:
  # Minimum keyword match score (0-100) to save role
  min_match_score: 50
  
  # Keywords that boost relevance
  must_have_keywords:
    - measurement
    - attribution
    - experimentation
    - incrementality
    - marketing science
    
  # Skip roles containing these terms
  exclude_keywords:
    - junior
    - intern
    - entry level
    
  # Maximum age of posting to consider (days)
  max_age_days: 30
