# Job Sources for Mission Control - STARTER TEMPLATE
#
# This is the project default, used by a workspace that has no config of its
# own. Your real, personal list lives in workspace/<name>/config/job-sources.yaml
# (gitignored) so it travels with that person's data and never ships upstream.
# `uv run setup.py --user NAME` seeds a workspace from this file.
#
# Everything below is an EXAMPLE. Replace the companies and keywords with your
# own targets - the structure and the rules are what matter.

# ============================================================
# TARGET COMPANIES
# ============================================================
# Companies from your existing tracker, prioritized

companies:
  # priority 1 is reserved for the board-wide aggregators below, which often
  # surface the same roles first. Use 2 for real targets, 3 for long shots.
  #
  # api_url is what makes a company cheap to scan. Two common boards:
  #   Greenhouse  https://boards-api.greenhouse.io/v1/boards/<slug>/jobs
  #   Ashby       https://api.ashbyhq.com/posting-api/job-board/<slug>
  # Set it to null for a custom careers system - the role is then tracked by
  # hand rather than scanned.

  - name: Anthropic
    careers_url: https://www.anthropic.com/careers
    api_url: https://boards-api.greenhouse.io/v1/boards/anthropic/jobs
    priority: 2

  - name: OpenAI
    careers_url: https://openai.com/careers/search
    api_url: https://api.ashbyhq.com/posting-api/job-board/openai
    priority: 2

  - name: Example Corp
    careers_url: https://example.com/careers
    api_url: null  # custom system - no automatic scan
    priority: 3

# ============================================================
# BOARD-WIDE AGGREGATORS
# ============================================================
# Boards with no single company - one platform hosting many employers'
# postings. These need queries/categories instead of a per-company api_url,
# so they get their own section rather than living under `companies:`.

aggregators:
  - name: Built In
    provider: builtin
    host: builtin.com          # or a market host, e.g. www.builtinnyc.com
    # scope: remote            # uncomment to restrict to /jobs/remote
    queries:            # EXAMPLE - use the phrases you would actually search
      - "data science"
      - "analytics"
    categories: []
    max_pages: 2
    priority: 1  # aggregators surface the same roles many company boards post individually

# ============================================================
# LINKEDIN SEARCH
# ============================================================
# The scanner will generate LinkedIn search URLs for your keywords
# You can click these to see aggregated results

linkedin:
  enabled: true
  search_keywords:      # EXAMPLE - your own search phrases
    - "data science"
    - "analytics"
  location: "United States"
  
# ============================================================
# JOB BOARDS (Optional)
# ============================================================
# Uncomment to enable tech job boards
# Note: Indeed is intentionally excluded (low signal/noise)

# boards:
#   - name: Y Combinator
#     url: https://www.ycombinator.com/companies/jobs
#     category: Startups
    
#   - name: AngelList
#     url: https://angel.co/jobs
#     category: Startups

#   - name: RemoteOK
#     url: https://remoteok.com/remote-data-science-jobs
#     category: Remote

# ============================================================
# SCANNING RULES
# ============================================================
rules:
  # Minimum keyword match score (0-100) to save role
  min_match_score: 50
  
  # Keywords that boost relevance
  must_have_keywords:   # EXAMPLE - the terms that define a good role for you
    - data science
    - analytics
    
  # Skip roles containing these terms
  exclude_keywords:
    - junior
    - intern
    - entry level
    
  # Maximum age of posting to consider (days)
  max_age_days: 30

  # Cap on freshly-scraped live postings judged in one run (LLM fit calls cost
  # real money/quota). --max-live on the CLI overrides this for a single run.
  max_live_roles: 200

  # Roles judged per LLM fit call. Smaller batches give each role more of the
  # model's attention; the batch still needs a few roles in it, because the
  # scoring calibration works by comparison across the batch.
  fit_batch_size: 6

  # Title heuristics for the LIVE SCAN only (agents/job_intel.py): a brand-new
  # live find whose title matches one of these (case-insensitive, whole-phrase)
  # is closed immediately - Status "04 Closed", recommendation "skip" - with NO
  # LLM fit call spent on it. Existing tracker rows are never touched by this,
  # regardless of title, so a role you added or edited yourself is safe.
  # Add or remove phrases freely; each is a substring match with word
  # boundaries, so "Machine Learning Engineer" also matches "Senior Machine
  # Learning Engineer" but not "Machine Learning Engineering Manager"'s
  # "Engineering".
  # EXAMPLE - titles you never want. Empty by default so a new workspace
  # closes nothing automatically until you decide what to exclude.
  auto_close_titles: []
