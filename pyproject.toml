[project]
name = "mission-control"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "jeffreyparks", email = "jeff@accolade.digital" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "feedparser>=6.0.14",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pypdf>=6.18.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
mission-control = "mission_control:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
