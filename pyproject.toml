[project]
name = "mission-control"
version = "0.1.0"
description = "Agentic-system design and LLM evaluation, applied to career development"
authors = [
    { name = "jeffreyparks", email = "jeffreyparks21@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "feedparser>=6.0.14",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "pandas>=2.1.0,<3.0.0",
    "pypdf>=6.18.0",
    "python-dotenv>=1.2.3",
    "python-jobspy>=1.1.82",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
mc = "mission_control:main"

[tool.uv]
# python-jobspy pins NUMPY==1.26.3 and pandas<3, but only calls pd.DataFrame,
# pd.concat and np.round. Verified against python-jobspy 1.1.82.
override-dependencies = ["pandas>=2.1.0,<3.0.0", "numpy>=2.1"]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# tests/conftest.py runs each script-style test_*.py in its own interpreter.
testpaths = ["tests"]
